<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Summarize Text</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 400px;
        padding: 15px;
        box-sizing: border-box;
      }
      h2 {
        margin-top: 0;
      }
      textarea {
        width: 100%;
        height: 120px;
        margin-bottom: 10px;
        resize: vertical;
      }
      button {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #output {
        margin-top: 15px;
        padding: 10px;
        border: 1px solid #ccc;
        min-height: 80px; /* Increased for visibility */
        max-height: 200px; /* Limit height to prevent popup overflow */
        overflow-y: auto; /* Scrollbar for long text */
        overflow-wrap: break-word; /* Wrap long words */
        white-space: pre-wrap; /* Preserve formatting */
        background-color: #f9f9f9;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h2>Summarize Text</h2>
    <textarea id="input" placeholder="Enter text to summarize..."></textarea>
    <button id="summarize">Summarize</button>
    <div id="output">Result will appear here...</div>
    <script src="popup.js"></script>
  </body>
</html>
